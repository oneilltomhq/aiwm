<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIWM</title>
<style>
  :root {
    --accent: #6c63ff;
    --accent-glow: rgba(108, 99, 255, 0.35);
    --danger: #ff4466;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    height: 100dvh;
    width: 100dvw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- Fullscreen VNC workspace --- */
  .workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .vnc-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #666;
    font-size: 14px;
    z-index: 1;
    pointer-events: none;
  }

  .vnc-overlay .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #333;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .vnc-overlay.hidden { display: none; }

  /* --- Floating voice controls --- */
  .voice-controls {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }

  /* Transcript bubble */
  .transcript {
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 8px 16px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.8);
    max-width: 400px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .transcript.visible { opacity: 1; }

  /* Status indicator (thinking, speaking) */
  .status-pill {
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 4px 12px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-pill.visible { opacity: 1; }

  .thinking-dots {
    display: flex;
    gap: 3px;
  }

  .thinking-dots span {
    width: 4px;
    height: 4px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .thinking-dots span:nth-child(2) { animation-delay: 0.16s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.32s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-4px); }
  }

  .audio-bars {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 10px;
  }

  .audio-bars span {
    width: 2px;
    background: var(--accent);
    border-radius: 1px;
    animation: audioBar 0.8s ease-in-out infinite;
  }

  .audio-bars span:nth-child(1) { height: 3px; animation-delay: 0s; }
  .audio-bars span:nth-child(2) { height: 5px; animation-delay: 0.15s; }
  .audio-bars span:nth-child(3) { height: 8px; animation-delay: 0.3s; }
  .audio-bars span:nth-child(4) { height: 4px; animation-delay: 0.45s; }

  @keyframes audioBar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* Mic button */
  .mic-btn {
    pointer-events: auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .mic-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .mic-btn:active { transform: scale(0.92); }

  .mic-btn.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
    box-shadow: 0 0 20px rgba(255, 68, 102, 0.4);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 102, 0.4); }
    50% { box-shadow: 0 0 0 10px rgba(255, 68, 102, 0); }
  }

  /* Connection indicator */
  .connection-dot {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff4466;
    z-index: 10;
    transition: background 0.3s;
  }

  .connection-dot.connected { background: #44ff88; }
</style>
</head>
<body>

<div class="workspace" id="workspace">
  <div class="vnc-overlay" id="vncOverlay">
    <div class="spinner"></div>
    <div>Connecting to workspace...</div>
  </div>

  <div class="connection-dot" id="connectionDot"></div>

  <div class="voice-controls">
    <div class="transcript" id="transcript"></div>
    <div class="status-pill" id="statusPill">
      <div class="thinking-dots" id="thinkingDots" style="display:none"><span></span><span></span><span></span></div>
      <div class="audio-bars" id="audioBars" style="display:none"><span></span><span></span><span></span><span></span></div>
      <span id="statusText"></span>
    </div>
    <button class="mic-btn" id="micBtn" title="Hold to talk">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>
</div>

<!-- noVNC -->
<script type="module">
import RFB from './novnc/core/rfb.js';

const workspace = document.getElementById('workspace');
const vncOverlay = document.getElementById('vncOverlay');
let rfb = null;

function connectVNC() {
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = wsProto + '//' + location.host + '/vnc';

  vncOverlay.classList.remove('hidden');

  try {
    rfb = new RFB(workspace, url, {
      scaleViewport: true,
      resizeSession: false,
      showDotCursor: true,
      qualityLevel: 6,
      compressionLevel: 2,
    });

    rfb.addEventListener('connect', () => {
      vncOverlay.classList.add('hidden');
    });

    rfb.addEventListener('disconnect', () => {
      vncOverlay.innerHTML = '<div class="spinner"></div><div>Reconnecting...</div>';
      vncOverlay.classList.remove('hidden');
      setTimeout(connectVNC, 3000);
    });
  } catch (e) {
    console.error('VNC error:', e);
    setTimeout(connectVNC, 5000);
  }
}

connectVNC();
</script>

<script>
(function() {
  const micBtn = document.getElementById('micBtn');
  const connectionDot = document.getElementById('connectionDot');
  const transcript = document.getElementById('transcript');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const thinkingDots = document.getElementById('thinkingDots');
  const audioBars = document.getElementById('audioBars');

  let ws = null;
  let audioContext = null;
  let mediaStream = null;
  let audioProcessor = null;
  let isRecording = false;
  let audioQueue = [];
  let isPlaying = false;
  let reconnectTimer = null;
  let transcriptFadeTimer = null;

  // --- WebSocket ---
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => {
      connectionDot.classList.add('connected');
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      ws.send(JSON.stringify({
        type: 'viewport',
        width: window.innerWidth,
        height: window.innerHeight,
      }));
    };

    ws.onmessage = (event) => {
      try { handleMessage(JSON.parse(event.data)); }
      catch (e) { console.error('Parse error:', e); }
    };

    ws.onclose = () => {
      connectionDot.classList.remove('connected');
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = (err) => console.error('WS error:', err);
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'transcript':
        if (msg.text && !msg.isFinal) {
          showTranscript(msg.text);
        } else {
          hideTranscript();
        }
        break;

      case 'thinking':
        showStatus('thinking');
        break;

      case 'thinking_done':
      case 'response':
        hideStatus();
        break;

      case 'tts_start':
        audioQueue = [];
        break;

      case 'audio':
        audioQueue.push(msg.data);
        if (!isPlaying) playAudio();
        break;

      case 'audio_end':
        break;

      case 'tool_call':
        // Could show subtle indicator, for now silent
        break;

      case 'error':
        console.error('[aiwm]', msg.message);
        break;

      case 'user_message':
        // No chat UI — voice-only
        break;
    }
  }

  // --- Transcript overlay ---
  function showTranscript(text) {
    clearTimeout(transcriptFadeTimer);
    transcript.textContent = text;
    transcript.classList.add('visible');
  }

  function hideTranscript() {
    transcriptFadeTimer = setTimeout(() => {
      transcript.classList.remove('visible');
    }, 500);
  }

  // --- Status pill ---
  function showStatus(mode) {
    if (mode === 'thinking') {
      thinkingDots.style.display = 'flex';
      audioBars.style.display = 'none';
      statusText.textContent = 'Thinking...';
    } else if (mode === 'speaking') {
      thinkingDots.style.display = 'none';
      audioBars.style.display = 'flex';
      statusText.textContent = 'Speaking';
    }
    statusPill.classList.add('visible');
  }

  function hideStatus() {
    statusPill.classList.remove('visible');
  }

  // --- Audio playback ---
  async function playAudio() {
    if (audioQueue.length === 0) {
      isPlaying = false;
      hideStatus();
      return;
    }
    isPlaying = true;
    showStatus('speaking');

    // Batch all available chunks
    await new Promise(r => setTimeout(r, 150));
    const chunks = audioQueue.splice(0);
    const binaryChunks = chunks.map(b64 => {
      const raw = atob(b64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    });
    const totalLen = binaryChunks.reduce((s, c) => s + c.length, 0);
    const combined = new Uint8Array(totalLen);
    let offset = 0;
    for (const chunk of binaryChunks) {
      combined.set(chunk, offset);
      offset += chunk.length;
    }

    const blob = new Blob([combined], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);

    audio.onended = () => {
      URL.revokeObjectURL(url);
      if (audioQueue.length > 0) playAudio();
      else { isPlaying = false; hideStatus(); }
    };
    audio.onerror = () => {
      URL.revokeObjectURL(url);
      isPlaying = false;
      hideStatus();
    };
    try { await audio.play(); } catch (e) {
      console.error('Playback failed:', e);
      isPlaying = false;
      hideStatus();
    }
  }

  // --- Microphone ---
  async function startRecording() {
    if (isRecording) return;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
      });
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(mediaStream);
      audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      audioProcessor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const float32 = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          const s = Math.max(-1, Math.min(1, float32[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        const bytes = new Uint8Array(int16.buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        send({ type: 'audio', data: btoa(binary) });
      };

      source.connect(audioProcessor);
      audioProcessor.connect(audioContext.destination);
      isRecording = true;
      micBtn.classList.add('recording');
      send({ type: 'voice_start' });
    } catch (err) {
      console.error('[mic] Error:', err);
    }
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    micBtn.classList.remove('recording');
    if (audioProcessor) audioProcessor.disconnect();
    audioProcessor = null;
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
    if (audioContext) audioContext.close();
    audioContext = null;
    send({ type: 'voice_stop' });
    hideTranscript();
  }

  // --- Events ---
  micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('mouseup', stopRecording);
  micBtn.addEventListener('mouseleave', stopRecording);
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
  micBtn.addEventListener('touchcancel', stopRecording);

  window.addEventListener('resize', () => {
    send({ type: 'viewport', width: window.innerWidth, height: window.innerHeight });
  });

  connect();
})();
</script>
</body>
</html>
