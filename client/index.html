<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIWM</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1e1e2e;
    --border: #2a2a3e;
    --text: #e0e0f0;
    --text-dim: #8888aa;
    --accent: #6c63ff;
    --accent-glow: rgba(108, 99, 255, 0.3);
    --danger: #ff4466;
    --success: #44ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
  }

  .status-dot.connected { background: var(--success); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .message.agent {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    white-space: pre-wrap;
  }

  .message.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    padding: 4px 8px;
  }

  .message.tool {
    align-self: flex-start;
    background: rgba(108, 99, 255, 0.08);
    border: 1px solid rgba(108, 99, 255, 0.2);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: var(--text-dim);
    border-radius: 8px;
  }

  .message.error {
    align-self: center;
    background: rgba(255, 68, 102, 0.1);
    border: 1px solid rgba(255, 68, 102, 0.3);
    color: var(--danger);
    font-size: 12px;
  }

  .transcript-bar {
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    min-height: 0;
    transition: min-height 0.2s;
    overflow: hidden;
  }

  .transcript-bar.active { min-height: 32px; }

  .input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .text-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }

  .text-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  .text-input::placeholder { color: var(--text-dim); }

  .btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .btn:active { transform: scale(0.92); }

  .btn-send {
    background: var(--accent);
    color: white;
  }

  .btn-send:hover { background: #7b73ff; }

  .btn-mic {
    background: var(--surface2);
    border: 2px solid var(--border);
    color: var(--text-dim);
  }

  .btn-mic:hover { border-color: var(--accent); color: var(--accent); }

  .btn-mic.recording {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 102, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(255, 68, 102, 0); }
  }

  .thinking {
    display: none;
    align-self: flex-start;
    padding: 10px 14px;
    gap: 4px;
  }

  .thinking.visible { display: flex; }

  .thinking span {
    width: 6px;
    height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.16s; }
  .thinking span:nth-child(3) { animation-delay: 0.32s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }

  .audio-indicator {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: rgba(108, 99, 255, 0.1);
    border-radius: 12px;
    font-size: 11px;
    color: var(--accent);
  }

  .audio-indicator.playing { display: inline-flex; }

  .audio-bars {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
  }

  .audio-bars span {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: audioBar 0.8s ease-in-out infinite;
  }

  .audio-bars span:nth-child(1) { height: 4px; animation-delay: 0s; }
  .audio-bars span:nth-child(2) { height: 8px; animation-delay: 0.15s; }
  .audio-bars span:nth-child(3) { height: 12px; animation-delay: 0.3s; }
  .audio-bars span:nth-child(4) { height: 6px; animation-delay: 0.45s; }

  @keyframes audioBar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>AIWM</h1>
  <div class="status">
    <div class="audio-indicator" id="audioIndicator">
      <div class="audio-bars"><span></span><span></span><span></span><span></span></div>
      Speaking
    </div>
    <span id="statusText">Connecting...</span>
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<div class="messages" id="messages"></div>

<div class="transcript-bar" id="transcriptBar"></div>

<div class="input-area">
  <button class="btn btn-mic" id="micBtn" title="Hold to talk">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <input type="text" class="text-input" id="textInput" placeholder="Type a message..." autocomplete="off">
  <button class="btn btn-send" id="sendBtn" title="Send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
(function() {
  const messagesEl = document.getElementById('messages');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const transcriptBar = document.getElementById('transcriptBar');
  const audioIndicator = document.getElementById('audioIndicator');

  let ws = null;
  let audioContext = null;
  let mediaStream = null;
  let audioProcessor = null;
  let isRecording = false;
  let audioQueue = [];
  let isPlaying = false;
  let reconnectTimer = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => {
      statusDot.classList.add('connected');
      statusText.textContent = 'Connected';
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      ws.send(JSON.stringify({
        type: 'viewport',
        width: window.innerWidth,
        height: window.innerHeight,
      }));
    };

    ws.onmessage = (event) => {
      try {
        handleServerMessage(JSON.parse(event.data));
      } catch (e) {
        console.error('Parse error:', e);
      }
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = 'Disconnected';
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = (err) => console.error('WS error:', err);
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  }

  function handleServerMessage(msg) {
    switch (msg.type) {
      case 'response':
        addMessage(msg.text, 'agent');
        break;
      case 'transcript':
        if (msg.text) {
          transcriptBar.textContent = msg.isFinal ? '' : '\u{1F399}\uFE0F ' + msg.text;
          transcriptBar.classList.toggle('active', !msg.isFinal && !!msg.text);
        }
        break;
      case 'audio':
        audioQueue.push(msg.data);
        if (!isPlaying) playNextAudioChunk();
        break;
      case 'audio_end':
        break;
      case 'tts_start':
        audioQueue = [];
        break;
      case 'tool_call':
        addMessage('\u{1F527} ' + msg.name + '(' + truncate(JSON.stringify(msg.args), 120) + ')', 'tool');
        break;
      case 'thinking':
        showThinking(true);
        break;
      case 'error':
        addMessage(msg.message, 'error');
        break;
    }
  }

  async function playNextAudioChunk() {
    if (audioQueue.length === 0) {
      isPlaying = false;
      audioIndicator.classList.remove('playing');
      return;
    }
    isPlaying = true;
    audioIndicator.classList.add('playing');

    // Wait a moment to accumulate chunks for smoother playback
    await new Promise(r => setTimeout(r, 200));

    const chunks = audioQueue.splice(0);
    const binaryChunks = chunks.map(function(b64) {
      const raw = atob(b64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    });
    const totalLen = binaryChunks.reduce(function(s, c) { return s + c.length; }, 0);
    const combined = new Uint8Array(totalLen);
    let offset = 0;
    for (const chunk of binaryChunks) {
      combined.set(chunk, offset);
      offset += chunk.length;
    }

    const blob = new Blob([combined], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);

    audio.onended = function() {
      URL.revokeObjectURL(url);
      if (audioQueue.length > 0) {
        playNextAudioChunk();
      } else {
        isPlaying = false;
        audioIndicator.classList.remove('playing');
      }
    };

    audio.onerror = function() {
      URL.revokeObjectURL(url);
      isPlaying = false;
      audioIndicator.classList.remove('playing');
    };

    try { await audio.play(); } catch (e) {
      console.error('Playback failed:', e);
      isPlaying = false;
      audioIndicator.classList.remove('playing');
    }
  }

  async function startRecording() {
    if (isRecording) return;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(mediaStream);
      audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

      audioProcessor.onaudioprocess = function(e) {
        if (!isRecording) return;
        const float32 = e.inputBuffer.getChannelData(0);
        const int16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          const s = Math.max(-1, Math.min(1, float32[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        // Send as base64 — need to handle large arrays without stack overflow
        const bytes = new Uint8Array(int16.buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        send({ type: 'audio', data: btoa(binary) });
      };

      source.connect(audioProcessor);
      audioProcessor.connect(audioContext.destination);

      isRecording = true;
      micBtn.classList.add('recording');
      send({ type: 'voice_start' });
    } catch (err) {
      console.error('Mic error:', err);
      addMessage('Microphone access denied.', 'error');
    }
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    micBtn.classList.remove('recording');
    if (audioProcessor) audioProcessor.disconnect();
    audioProcessor = null;
    if (mediaStream) mediaStream.getTracks().forEach(function(t) { t.stop(); });
    mediaStream = null;
    if (audioContext) audioContext.close();
    audioContext = null;
    send({ type: 'voice_stop' });
    transcriptBar.textContent = '';
    transcriptBar.classList.remove('active');
  }

  function addMessage(text, type) {
    showThinking(false);
    const el = document.createElement('div');
    el.className = 'message ' + type;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  let thinkingEl = null;
  function showThinking(show) {
    if (show && !thinkingEl) {
      thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking visible';
      thinkingEl.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(thinkingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (!show && thinkingEl) {
      thinkingEl.remove();
      thinkingEl = null;
    }
  }

  function truncate(s, n) {
    return s.length > n ? s.substring(0, n) + '...' : s;
  }

  function sendText() {
    const text = textInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    send({ type: 'text', text: text });
    textInput.value = '';
  }

  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText();
    }
  });

  micBtn.addEventListener('mousedown', function(e) { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('mouseup', stopRecording);
  micBtn.addEventListener('mouseleave', stopRecording);
  micBtn.addEventListener('touchstart', function(e) { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('touchend', function(e) { e.preventDefault(); stopRecording(); });
  micBtn.addEventListener('touchcancel', stopRecording);

  window.addEventListener('resize', function() {
    send({ type: 'viewport', width: window.innerWidth, height: window.innerHeight });
  });

  connect();
})();
</script>
</body>
</html>
