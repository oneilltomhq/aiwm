# Headless sway config for AI-driven workspace

# No hardware inputs in headless mode
# Use the headless backend

# Default layout - tabbed on small viewports, tiling on large
default_orientation horizontal

# No window decorations - clean look for streaming
default_border pixel 2

# Colors
client.focused          #4c7899 #285577 #ffffff #2e9ef4 #285577
client.unfocused        #333333 #222222 #888888 #292d2e #222222

# Virtual output (will be created by WLR_BACKENDS=headless)
# Resolution can be changed dynamically via IPC

# Font
font pango:monospace 11

# Enable IPC
# (enabled by default in sway)

# No bar for now - clean workspace
bar {
    mode invisible
}
